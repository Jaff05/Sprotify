<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprotify</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap');
  :root{--green:#1db954;--green-dark:#17a349;--bg:#0a0a0a;--sidebar:#111;--card:#181818;--card-hover:#282828;--text:#fff;--muted:#b3b3b3;--border:#282828}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:grid;grid-template-columns:200px 1fr;grid-template-rows:1fr 80px;overflow:hidden;user-select:none;font-size:13px}
  #loginScreen{position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
  #loginScreen h1{font-size:28px;color:var(--green);font-weight:700}
  #loginScreen p{color:var(--muted);font-size:12px}
  #loginScreen input{background:#181818;border:1px solid var(--border);color:#fff;padding:10px 16px;border-radius:20px;width:240px;text-align:center;font-size:14px;outline:none;font-family:inherit}
  #loginScreen input:focus{border-color:var(--green)}
  #loginScreen button,.btn-confirm,.upload-btn{background:var(--green);color:#000;border:none;border-radius:20px;font-weight:700;cursor:pointer;font-family:inherit}
  #loginScreen button{padding:8px 24px;font-size:13px}
  #lyricsOverlay{position:fixed;inset:0;bottom:80px;background:linear-gradient(180deg,#3d3d3d,#0a0a0a);z-index:90;display:none;flex-direction:column;padding:30px;overflow-y:auto}
  #lyricsOverlay.open{display:flex}
  .lyrics-close{align-self:flex-end;background:rgba(0,0,0,.4);border:none;color:#fff;padding:8px 16px;border-radius:20px;cursor:pointer;font-weight:700;font-family:inherit;font-size:12px}
  .lyrics-container{max-width:700px;margin:20px auto;width:100%}
  .lyrics-title{font-size:32px;font-weight:700;margin-bottom:6px}
  .lyrics-artist{font-size:16px;color:rgba(255,255,255,.7);margin-bottom:30px}
  .lyrics-content{font-size:26px;font-weight:700;line-height:1.5;white-space:pre-wrap;letter-spacing:-.5px}
  .sidebar{background:var(--sidebar);display:flex;flex-direction:column;padding:12px 6px;overflow-y:auto;border-right:1px solid var(--border)}
  .logo{font-size:18px;font-weight:700;color:var(--green);padding:6px 12px 16px}
  .nav-label{font-size:9px;font-weight:700;letter-spacing:1px;color:var(--muted);padding:4px 12px 6px;text-transform:uppercase}
  .nav-item{padding:8px 12px;border-radius:4px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500}
  .nav-item:hover,.nav-item.active{color:var(--text);background:var(--card-hover)}
  .nav-item.active{color:var(--green)}
  .divider{height:1px;background:var(--border);margin:8px 6px}
  .playlist-list{flex:1;overflow-y:auto}
  .playlist-item{padding:6px 12px;cursor:pointer;color:var(--muted);font-size:12.5px;border-radius:4px;display:flex;align-items:center;gap:8px}
  .playlist-item:hover{color:var(--text);background:var(--card-hover)}
  .playlist-item.active{color:var(--text);background:rgba(29,185,84,.1)}
  .playlist-item-thumb{width:22px;height:22px;border-radius:3px;background:var(--card-hover);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;overflow:hidden}
  .playlist-item-thumb img,.track-thumb img,.card-img img,.playlist-cover img,.now-thumb img,.image-preview-box img{width:100%;height:100%;object-fit:cover}
  .new-playlist-btn{margin:4px 12px;padding:8px 10px;background:transparent;border:1px dashed var(--border);color:var(--muted);border-radius:4px;cursor:pointer;font-size:12px;font-family:inherit;width:calc(100% - 24px)}
  .new-playlist-btn:hover{border-color:var(--green);color:var(--green)}
  .main{overflow-y:auto;background:linear-gradient(180deg,#12121f,var(--bg) 300px)}
  .main-header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;position:sticky;top:0;background:rgba(10,10,10,.8);backdrop-filter:blur(12px);z-index:10}
  .view-title{font-size:22px;font-weight:700}
  .upload-btn{padding:8px 16px;font-size:12.5px}
  .upload-btn:hover,.btn-confirm:hover{background:var(--green-dark)}
  .content-area{padding:0 24px 32px}
  .playlist-header{display:flex;align-items:flex-end;gap:20px;padding:16px 0 24px}
  .playlist-cover{width:160px;height:160px;border-radius:6px;background:linear-gradient(135deg,#282828,#121212);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 6px 16px rgba(0,0,0,.5);font-size:50px;overflow:hidden}
  .playlist-meta h1{font-size:44px;font-weight:700;line-height:1.1;margin-bottom:4px;letter-spacing:-1px}
  .playlist-meta p,.playlist-track-count{color:var(--muted);font-size:13px}
  .play-all-btn{width:44px;height:44px;border-radius:50%;background:var(--green);border:none;cursor:pointer;color:#000;margin-bottom:20px;font-size:18px}
  .track-list-header,.track-row{display:grid;grid-template-columns:36px 1fr 1fr 60px;padding:6px 12px;align-items:center}
  .track-list-header{border-bottom:1px solid var(--border);color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:6px}
  .track-row{border-radius:4px;cursor:pointer}
  .track-row:hover{background:var(--card-hover)}
  .track-row.playing,.track-row.playing .track-name{color:var(--green)}
  .track-num{color:var(--muted);text-align:center;position:relative;width:16px}
  .track-play-icon{display:none;position:absolute;inset:0;place-items:center;color:var(--green);font-size:11px}
  .track-row:hover .track-num-text{display:none}
  .track-row:hover .track-play-icon{display:grid}
  .track-info{display:flex;align-items:center;gap:12px;overflow:hidden}
  .track-thumb{width:32px;height:32px;border-radius:3px;background:var(--card-hover);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .track-name,.track-artist,.now-title,.now-artist,.card-name,.card-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track-name{font-size:13.5px;font-weight:500}
  .track-artist,.track-duration{font-size:13px;color:var(--muted)}
  .track-duration{text-align:right}
  .section-title{font-size:16px;font-weight:700;margin:16px 0 12px}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;margin-bottom:24px}
  .card{background:var(--card);border-radius:6px;padding:12px;cursor:pointer}
  .card:hover{background:var(--card-hover)}
  .card-img{width:100%;aspect-ratio:1;border-radius:4px;background:linear-gradient(135deg,#282828,#121212);margin-bottom:10px;display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden}
  .card-name{font-size:13px;font-weight:700;margin-bottom:2px}
  .card-sub{font-size:11.5px;color:var(--muted)}
  .player{grid-column:1/-1;background:var(--card);border-top:1px solid var(--border);display:grid;grid-template-columns:240px 1fr 240px;align-items:center;padding:0 16px;z-index:20}
  .now-playing{display:flex;align-items:center;gap:10px;min-width:0}
  .now-thumb{width:44px;height:44px;border-radius:3px;background:var(--card-hover);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .now-info{min-width:0}
  .now-title{font-size:13px;font-weight:500}
  .now-artist{font-size:11.5px;color:var(--muted)}
  .player-center{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:500px;margin:0 auto}
  .player-controls{display:flex;align-items:center;gap:16px}
  .ctrl-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px}
  .ctrl-btn:hover{color:var(--text)}
  .ctrl-btn.active{color:var(--green)}
  .play-pause-btn{width:32px;height:32px;background:var(--text);border:none;border-radius:50%;cursor:pointer;color:#000;font-size:13px}
  .progress-bar-area{display:flex;align-items:center;gap:10px;width:100%}
  .time-label{font-size:10px;color:var(--muted);width:35px;text-align:center}
  .progress-bar{flex:1;height:3px;background:#333;border-radius:2px;cursor:pointer}
  .progress-bar:hover{height:5px}
  .progress-fill{height:100%;background:var(--green);border-radius:2px;pointer-events:none}
  .player-right{display:flex;align-items:center;justify-content:flex-end;gap:14px}
  .lyrics-toggle-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
  .lyrics-toggle-btn:hover{color:#fff;border-color:#fff}
  .lyrics-toggle-btn.active{background:#fff;color:#000}
  .volume-bar{width:70px;height:3px;background:#333;border-radius:2px;cursor:pointer}
  .volume-fill{height:100%;background:var(--muted);border-radius:2px;pointer-events:none}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:none;align-items:center;justify-content:center}
  .modal-overlay.open{display:flex}
  .modal{background:#282828;border-radius:8px;padding:24px;width:440px;max-width:92vw;max-height:85vh;overflow-y:auto}
  .modal h2{font-size:18px;margin-bottom:16px}
  .modal input,.modal select,.modal textarea{width:100%;background:#1e1e1e;border:1px solid transparent;border-radius:4px;color:var(--text);font-family:inherit;font-size:13px;padding:10px 12px;margin-bottom:12px;outline:none}
  .modal textarea{resize:vertical;min-height:80px}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px}
  .btn-cancel{background:transparent;border:none;color:#fff;padding:10px 16px;cursor:pointer;font-family:inherit;font-weight:700}
  .btn-confirm{padding:10px 20px;font-size:13px}
  .drop-zone{border:2px dashed #404040;border-radius:6px;padding:20px;text-align:center;cursor:pointer;margin-bottom:12px;color:var(--muted)}
  .drop-zone:hover{border-color:var(--green);color:var(--green)}
  .upload-list{max-height:200px;overflow-y:auto;margin-bottom:12px;background:#1a1a1a;border-radius:4px;padding:0 4px}
  .upload-item{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)}
  .upload-item-header{display:flex;align-items:center;gap:10px}
  .upload-item-img-pick{width:36px;height:36px;border-radius:4px;background:var(--card-hover);border:1px dashed #555;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .upload-item-inputs{flex:1;display:flex;flex-direction:column;gap:4px}
  .upload-item input,.upload-item textarea{margin:0!important;padding:6px 10px!important;font-size:12px!important}
  .image-preview-box{width:120px;height:120px;border-radius:6px;overflow:hidden;background:#1e1e1e;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;cursor:pointer;font-size:36px}
  .upload-label{font-size:10px;font-weight:700;color:var(--muted);margin-bottom:6px;display:block;text-transform:uppercase}
  .empty-state{text-align:center;padding:40px 16px;color:var(--muted)}
  .context-menu{position:fixed;background:#282828;border-radius:4px;padding:4px;z-index:200;min-width:170px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none;border:1px solid #3e3e3e}
  .context-menu.open{display:block}
  .ctx-item{position:relative;padding:8px 12px;cursor:pointer;border-radius:3px;color:#eaeaea}
  .ctx-item:hover{background:var(--card-hover);color:#fff}
  .ctx-item.danger{color:#ff5555}
  .ctx-item.danger:hover{background:#e54444;color:#fff}
  .ctx-submenu{position:absolute;left:100%;top:0;background:#282828;border-radius:4px;padding:4px;min-width:160px;display:none;max-height:200px;overflow-y:auto;border:1px solid #3e3e3e}
  .ctx-item:hover .ctx-submenu{display:block}
  .sub-item{padding:8px 12px;font-size:12px;cursor:pointer;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub-item:hover{background:var(--card-hover);color:var(--green)}
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-thumb{background:#3e3e3e;border-radius:3px}
</style>
</head>
<body>

<div id="loginScreen">
  <h1>Sprotify</h1>
  <p id="loginHint">Laddar...</p>
  <input type="password" id="passInput" placeholder="Skriv in lösenord..." onkeydown="if(event.key==='Enter')checkPassword()">
  <button id="loginBtn" onclick="checkPassword()">Lås upp</button>
</div>

<aside class="sidebar">
  <div class="logo">🎵 Sprotify</div>
  <div class="nav-item active" id="navHome" onclick="showView('home')">Hem</div>
  <div class="nav-item" id="navLibrary" onclick="showView('library')">Bibliotek</div>
  <div class="divider"></div>
  <div class="nav-label">Spellistor</div>
  <button class="new-playlist-btn" onclick="openNewPlaylist()">+ Ny spellista</button>
  <div class="playlist-list" id="playlistList"></div>
</aside>

<main class="main">
  <div class="main-header">
    <div class="view-title" id="viewTitle">Hem</div>
    <button class="upload-btn" onclick="openUpload()">⬆ Ladda upp musik</button>
  </div>
  <div class="content-area" id="contentArea"></div>
</main>

<footer class="player">
  <div class="now-playing">
    <div class="now-thumb" id="nowThumb">🎵</div>
    <div class="now-info">
      <div class="now-title" id="nowTitle">Ingen låt vald</div>
      <div class="now-artist" id="nowArtist">–</div>
    </div>
  </div>
  <div class="player-center">
    <div class="player-controls">
      <button class="ctrl-btn" onclick="prevTrack()">⏮</button>
      <button class="play-pause-btn" onclick="togglePlay()" id="playPauseBtn">▶</button>
      <button class="ctrl-btn" onclick="nextTrack()">⏭</button>
      <button class="ctrl-btn" id="repeatBtn" onclick="toggleRepeat()" title="Repetera">🔁</button>
    </div>
    <div class="progress-bar-area">
      <span class="time-label" id="currentTime">0:00</span>
      <div class="progress-bar" id="progressBar" onclick="seekTo(event)"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <span class="time-label" id="totalTime">0:00</span>
    </div>
  </div>
  <div class="player-right">
    <button class="lyrics-toggle-btn" id="lyricsToggleBtn" onclick="toggleLyricsPanel()">LYRICS</button>
    <div class="volume-bar" id="volumeBar" onclick="setVolume(event)"><div class="volume-fill" id="volumeFill" style="width:80%"></div></div>
  </div>
</footer>

<div id="lyricsOverlay">
  <button class="lyrics-close" onclick="toggleLyricsPanel()">Stäng ✕</button>
  <div class="lyrics-container">
    <div class="lyrics-title" id="lyricsPanelTitle">Låttitel</div>
    <div class="lyrics-artist" id="lyricsPanelArtist">Artist</div>
    <div class="lyrics-content" id="lyricsPanelContent">Ingen text tillgänglig.</div>
  </div>
</div>

<div class="modal-overlay" id="uploadModal">
  <div class="modal">
    <h2>Ladda upp musik</h2>
    <div class="drop-zone" onclick="document.getElementById('fileInput').click()"><p>Välj ljudfiler</p></div>
    <input type="file" id="fileInput" accept="audio/*" multiple style="display:none" onchange="handleFiles(this.files);this.value=''">
    <div class="upload-list" id="uploadList"></div>
    <label class="upload-label">Välj spellista</label>
    <select id="uploadPlaylistSelect" onchange="document.getElementById('newPlaylistInputContainer').style.display=this.value==='new_custom_playlist'?'block':'none'"></select>
    <div id="newPlaylistInputContainer" style="display:none">
      <label class="upload-label">Skapa ny spellista med namnet:</label>
      <input type="text" id="uploadNewPlaylistName" placeholder="T.ex. Min nya lista">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('uploadModal')">Avbryt</button>
      <button class="btn-confirm" id="uploadConfirmBtn" onclick="confirmUpload()">Spara</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="playlistModal">
  <div class="modal">
    <h2>Ny spellista</h2>
    <div class="image-preview-box" onclick="document.getElementById('playlistImgInput').click()">
      <span id="playlistImgPlaceholder">🎵</span>
      <img id="playlistImgPreview" src="" alt="" style="display:none">
    </div>
    <input type="file" id="playlistImgInput" accept="image/*" style="display:none" onchange="handlePlaylistImg(this)">
    <input type="text" id="playlistName" placeholder="Spellistans namn">
    <input type="text" id="playlistDesc" placeholder="Beskrivning">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('playlistModal')">Avbryt</button>
      <button class="btn-confirm" onclick="confirmNewPlaylist()">Skapa</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editTrackModal">
  <div class="modal">
    <h2>Redigera låt</h2>
    <div class="image-preview-box" onclick="document.getElementById('editTrackImgInput').click()">
      <span id="editTrackImgPlaceholder">🎵</span>
      <img id="editTrackImgPreview" src="" alt="" style="display:none">
    </div>
    <input type="file" id="editTrackImgInput" accept="image/*" style="display:none" onchange="handleEditTrackImg(this)">
    <input type="text" id="editTrackName" placeholder="Titel">
    <input type="text" id="editTrackArtist" placeholder="Artist">
    <label class="upload-label">Redigera Låttext</label>
    <textarea id="editTrackLyrics" placeholder="Klistra in hela texten här..."></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('editTrackModal')">Avbryt</button>
      <button class="btn-confirm" onclick="confirmEditTrack()">Spara</button>
    </div>
  </div>
</div>

<div class="context-menu" id="contextMenu">
  <div class="ctx-item" onclick="ctxPlay()">▶ Spela</div>
  <div class="ctx-item">➕ Lägg till i spellista...<div class="ctx-submenu" id="ctxSubmenuPlaylists"></div></div>
  <div class="ctx-item" onclick="ctxEdit()">✏ Redigera</div>
  <div class="ctx-item danger" onclick="ctxDelete()">🗑 Ta bort</div>
</div>

<audio id="audioPlayer"></audio>

<script>
/* ══ LOKAL LAGRING (IndexedDB) – allt ligger på din egen dator ══ */
let db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('sprotify', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('tracks', { keyPath: 'id' });
      d.createObjectStore('playlists', { keyPath: 'id' });
      d.createObjectStore('meta', { keyPath: 'key' });
    };
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
}
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const st = (n, m = 'readonly') => db.transaction(n, m).objectStore(n);
const dbAll = n => req(st(n).getAll());
const dbGet = (n, k) => req(st(n).get(k));
const dbPut = (n, v) => req(st(n, 'readwrite').put(v));
const dbDel = (n, k) => req(st(n, 'readwrite').delete(k));

/* Blob → URL (cachas så vi inte skapar nya hela tiden) */
const urlCache = {};
function blobUrl(key, blob) {
  if (!blob) return '';
  if (!urlCache[key]) urlCache[key] = URL.createObjectURL(blob);
  return urlCache[key];
}
function dropUrl(key) { if (urlCache[key]) { URL.revokeObjectURL(urlCache[key]); delete urlCache[key]; } }
const audioUrl = t => blobUrl('a' + t.id, t.audio);
const trackCover = t => blobUrl('c' + t.id + (t.coverV || ''), t.cover);
const plCover = p => blobUrl('p' + p.id, p.cover);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const img = u => u ? `<img src="${u}">` : '🎵';

async function sha(text) {
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('sprotify:' + text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  let h = 0; for (const c of 'sprotify:' + text) h = (h * 31 + c.charCodeAt(0)) | 0;
  return String(h);
}

/* ══ STATE ══ */
let state = { tracks: [], playlists: [], currentTrackId: null, currentPlaylistId: null, queue: [], queueIndex: -1, isPlaying: false, isRepeat: false, volume: 0.8, view: 'home' };
let pendingFiles = [], ctxTrackId = null, editingTrackId = null, editingTrackNewImg = null, newPlaylistImgFile = null, savedHash = null;
const audio = document.getElementById('audioPlayer');

/* ══ INLOGGNING (lösenord sparas lokalt som hash) ══ */
(async function init() {
  try {
    await openDB();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    const m = await dbGet('meta', 'pw');
    savedHash = m ? m.value : null;
    document.getElementById('loginHint').textContent = savedHash ? 'Ange ditt lösenord' : 'Första gången – välj ett lösenord';
    document.getElementById('loginBtn').textContent = savedHash ? 'Lås upp' : 'Skapa lösenord';
  } catch (e) {
    document.getElementById('loginHint').textContent = 'Kunde inte öppna lokal lagring: ' + e.message;
  }
})();

async function checkPassword() {
  const v = document.getElementById('passInput').value;
  if (!v || !db) return;
  const h = await sha(v);
  if (!savedHash) {
    await dbPut('meta', { key: 'pw', value: h });
  } else if (h !== savedHash) {
    alert('Fel lösenord!'); return;
  }
  document.getElementById('loginScreen').style.display = 'none';
  load();
}

async function load() {
  state.playlists = await dbAll('playlists');
  state.tracks = (await dbAll('tracks')).sort((a, b) => (a.created || 0) - (b.created || 0));
  audio.volume = state.volume;
  setupAudioListeners();
  renderAll();
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);

/* ══ VYER ══ */
function showView(view, playlistId = null) {
  state.view = view; state.currentPlaylistId = playlistId;
  document.getElementById('navHome').classList.toggle('active', view === 'home');
  document.getElementById('navLibrary').classList.toggle('active', view === 'library');
  renderAll();
}
function renderAll() { renderPlaylistSidebar(); renderMain(); populateUploadPlaylistSelect(); }

function renderPlaylistSidebar() {
  const el = document.getElementById('playlistList'); el.innerHTML = '';
  state.playlists.forEach(p => {
    const d = document.createElement('div');
    d.className = 'playlist-item' + (state.currentPlaylistId === p.id ? ' active' : '');
    d.onclick = () => showView('playlist', p.id);
    d.innerHTML = `<div class="playlist-item-thumb">${img(plCover(p))}</div><span>${esc(p.name)}</span>`;
    el.appendChild(d);
  });
}

function renderMain() {
  const area = document.getElementById('contentArea'); area.innerHTML = '';
  const title = document.getElementById('viewTitle');
  if (state.view === 'home' || state.view === 'library') {
    title.textContent = state.view === 'home' ? 'Hem' : 'Bibliotek';
    area.innerHTML = '<div class="section-title">Spellistor</div>';
    const grid = document.createElement('div'); grid.className = 'card-grid';
    state.playlists.forEach(p => {
      const c = document.createElement('div'); c.className = 'card'; c.onclick = () => showView('playlist', p.id);
      c.innerHTML = `<div class="card-img">${img(plCover(p))}</div><div class="card-name">${esc(p.name)}</div><div class="card-sub">${esc(p.description || 'Spellista')}</div>`;
      grid.appendChild(c);
    });
    area.appendChild(grid);
    area.insertAdjacentHTML('beforeend', '<div class="section-title">Alla Låtar</div>');
    renderTrackTable(state.tracks, area);
  } else if (state.view === 'playlist') {
    const pl = state.playlists.find(p => p.id === state.currentPlaylistId);
    if (!pl) return showView('home');
    title.textContent = '';
    const tracks = state.tracks.filter(t => t.playlists === pl.id);
    area.innerHTML = `<div class="playlist-header"><div class="playlist-cover">${img(plCover(pl))}</div><div class="playlist-meta"><p>SPELLISTA</p><h1>${esc(pl.name)}</h1><p>${esc(pl.description || '')}</p><div class="playlist-track-count">${tracks.length} låtar</div></div></div>`;
    if (tracks.length) {
      const b = document.createElement('button'); b.className = 'play-all-btn'; b.textContent = '▶';
      b.onclick = () => playList(tracks, 0); area.appendChild(b);
    }
    renderTrackTable(tracks, area);
  }
}

function formatTime(s) {
  if (isNaN(s)) return '0:00';
  return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
}

function renderTrackTable(tracks, target) {
  if (!tracks.length) { target.insertAdjacentHTML('beforeend', '<div class="empty-state">Inga låtar här än</div>'); return; }
  target.insertAdjacentHTML('beforeend', '<div class="track-list-header"><div>#</div><div>Titel</div><div>Artist</div><div style="text-align:right">Tid</div></div>');
  tracks.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'track-row' + (state.currentTrackId === t.id ? ' playing' : '');
    row.onclick = () => playList(tracks, i);
    row.oncontextmenu = e => openContextMenu(e, t.id);
    row.innerHTML = `<div class="track-num"><span class="track-num-text">${i + 1}</span><span class="track-play-icon">▶</span></div><div class="track-info"><div class="track-thumb">${img(trackCover(t))}</div><div class="track-name">${esc(t.title)}</div></div><div class="track-artist">${esc(t.artist || 'Okänd')}</div><div class="track-duration" id="dur-${t.id}">--</div>`;
    target.appendChild(row);
    const tmp = new Audio(); tmp.preload = 'metadata';
    tmp.onloadedmetadata = () => { const el = document.getElementById('dur-' + t.id); if (el) el.textContent = formatTime(tmp.duration); };
    tmp.src = audioUrl(t);
  });
}

/* ══ UPPLADDNING ══ */
function populateUploadPlaylistSelect() {
  const sel = document.getElementById('uploadPlaylistSelect');
  sel.innerHTML = '<option value="">-- Välj ingen --</option><option value="new_custom_playlist">➕ Skapa ny spellista...</option>' +
    state.playlists.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
}
function openUpload() { document.getElementById('uploadModal').classList.add('open'); pendingFiles = []; document.getElementById('uploadList').innerHTML = ''; }
function openNewPlaylist() {
  document.getElementById('playlistModal').classList.add('open'); newPlaylistImgFile = null;
  document.getElementById('playlistImgPreview').style.display = 'none';
  document.getElementById('playlistImgPlaceholder').style.display = '';
  document.getElementById('playlistName').value = ''; document.getElementById('playlistDesc').value = '';
}
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function handleFiles(files) {
  for (const f of files) pendingFiles.push({ id: uid(), file: f, name: f.name.replace(/\.[^/.]+$/, ''), artist: 'Okänd artist', lyrics: '', imageFile: null });
  renderUploadList();
}
function renderUploadList() {
  const list = document.getElementById('uploadList'); list.innerHTML = '';
  pendingFiles.forEach((pf, i) => {
    const d = document.createElement('div'); d.className = 'upload-item';
    d.innerHTML = `<div class="upload-item-header"><div class="upload-item-img-pick" onclick="triggerItemImg(${i})"><span id="pf-thumb-${i}">${pf.imageFile ? '✅' : '🖼️'}</span></div><div class="upload-item-inputs"><input type="text" value="${esc(pf.name)}" placeholder="Titel" onchange="pendingFiles[${i}].name=this.value"><input type="text" value="${esc(pf.artist)}" placeholder="Artist" onchange="pendingFiles[${i}].artist=this.value"></div></div><textarea placeholder="Låttext / Lyrics" onchange="pendingFiles[${i}].lyrics=this.value"></textarea>`;
    list.appendChild(d);
  });
}
function triggerItemImg(idx) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = e => { if (e.target.files[0]) { pendingFiles[idx].imageFile = e.target.files[0]; document.getElementById('pf-thumb-' + idx).textContent = '✅'; } };
  inp.click();
}

async function confirmUpload() {
  const btn = document.getElementById('uploadConfirmBtn'); btn.disabled = true; btn.textContent = 'Sparar...';
  try {
    let target = document.getElementById('uploadPlaylistSelect').value;
    if (target === 'new_custom_playlist') {
      const name = document.getElementById('uploadNewPlaylistName').value.trim();
      if (name) {
        const p = { id: uid(), name, description: '', cover: null };
        await dbPut('playlists', p); state.playlists.push(p); target = p.id;
      } else target = null;
    }
    for (const pf of pendingFiles) {
      const t = { id: pf.id, title: pf.name, artist: pf.artist, lyrics: pf.lyrics, audio: pf.file, cover: pf.imageFile || null, playlists: target || null, created: Date.now() };
      await dbPut('tracks', t); state.tracks.push(t);
    }
  } catch (e) { alert('Kunde inte spara: ' + e.message); }
  btn.disabled = false; btn.textContent = 'Spara'; closeModal('uploadModal'); renderAll();
}

function handlePlaylistImg(input) {
  if (input.files[0]) {
    newPlaylistImgFile = input.files[0];
    const p = document.getElementById('playlistImgPreview');
    p.src = URL.createObjectURL(newPlaylistImgFile); p.style.display = 'block';
    document.getElementById('playlistImgPlaceholder').style.display = 'none';
  }
}
async function confirmNewPlaylist() {
  const name = document.getElementById('playlistName').value.trim(); if (!name) return;
  const p = { id: uid(), name, description: document.getElementById('playlistDesc').value.trim(), cover: newPlaylistImgFile || null };
  await dbPut('playlists', p); state.playlists.push(p); closeModal('playlistModal'); renderAll();
}

/* ══ LYRICS ══ */
function toggleLyricsPanel() {
  const panel = document.getElementById('lyricsOverlay'), btn = document.getElementById('lyricsToggleBtn');
  const open = panel.classList.toggle('open'); btn.classList.toggle('active', open);
  if (open) updateLyricsDisplay();
}
function updateLyricsDisplay() {
  const t = state.tracks.find(t => t.id === state.currentTrackId);
  document.getElementById('lyricsPanelTitle').textContent = t ? t.title : 'Ingen låt spelas';
  document.getElementById('lyricsPanelArtist').textContent = t ? (t.artist || 'Okänd') : '';
  document.getElementById('lyricsPanelContent').textContent = t ? (t.lyrics || 'Det finns ingen sparad text för den här låten.') : 'Välj en låt för att se text.';
}

/* ══ SPELARE ══ */
function playList(list, index) { state.queue = list; state.queueIndex = index; if (list[index]) loadTrack(list[index].id); }
function loadTrack(id) {
  const t = state.tracks.find(t => t.id === id); if (!t) return;
  state.currentTrackId = id; audio.src = audioUrl(t);
  document.getElementById('nowTitle').textContent = t.title;
  document.getElementById('nowArtist').textContent = t.artist || '–';
  document.getElementById('nowThumb').innerHTML = img(trackCover(t));
  document.getElementById('currentTime').textContent = '0:00'; document.getElementById('totalTime').textContent = '0:00';
  audio.play(); state.isPlaying = true; updatePlayButton(); updateLyricsDisplay(); renderAll();
}
function togglePlay() {
  if (!state.currentTrackId && state.tracks.length) return playList(state.tracks, 0);
  if (!state.currentTrackId) return;
  if (state.isPlaying) audio.pause(); else audio.play();
  state.isPlaying = !state.isPlaying; updatePlayButton();
}
function updatePlayButton() { document.getElementById('playPauseBtn').textContent = state.isPlaying ? '⏸' : '▶'; }
function nextTrack() { if (state.queue.length) { state.queueIndex = (state.queueIndex + 1) % state.queue.length; loadTrack(state.queue[state.queueIndex].id); } }
function prevTrack() { if (state.queue.length) { state.queueIndex = (state.queueIndex - 1 + state.queue.length) % state.queue.length; loadTrack(state.queue[state.queueIndex].id); } }
function toggleRepeat() { state.isRepeat = !state.isRepeat; document.getElementById('repeatBtn').classList.toggle('active', state.isRepeat); }

function setupAudioListeners() {
  audio.ontimeupdate = () => {
    if (!audio.duration) return;
    document.getElementById('progressFill').style.width = (audio.currentTime / audio.duration * 100) + '%';
    document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
  };
  audio.onloadedmetadata = () => { document.getElementById('totalTime').textContent = formatTime(audio.duration); };
  audio.onended = () => { if (state.isRepeat) { audio.currentTime = 0; audio.play(); } else nextTrack(); };
}
function seekTo(e) { if (audio.duration) audio.currentTime = (e.offsetX / e.currentTarget.offsetWidth) * audio.duration; }
function setVolume(e) {
  state.volume = Math.min(1, Math.max(0, e.offsetX / e.currentTarget.offsetWidth)); audio.volume = state.volume;
  document.getElementById('volumeFill').style.width = (state.volume * 100) + '%';
}

/* ══ HÖGERKLICKSMENY ══ */
function openContextMenu(e, id) {
  e.preventDefault(); ctxTrackId = id;
  const sub = document.getElementById('ctxSubmenuPlaylists'); sub.innerHTML = '';
  state.playlists.forEach(p => {
    const item = document.createElement('div'); item.className = 'sub-item'; item.textContent = p.name;
    item.onclick = async ev => {
      ev.stopPropagation();
      const t = state.tracks.find(t => t.id === ctxTrackId);
      if (t) { t.playlists = p.id; await dbPut('tracks', t); }
      closeContextMenu(); renderAll();
    };
    sub.appendChild(item);
  });
  const menu = document.getElementById('contextMenu');
  menu.style.top = e.clientY + 'px'; menu.style.left = e.clientX + 'px'; menu.classList.add('open');
  setTimeout(() => document.addEventListener('click', closeContextMenu), 10);
}
function closeContextMenu() { document.getElementById('contextMenu').classList.remove('open'); document.removeEventListener('click', closeContextMenu); }
function ctxPlay() { if (ctxTrackId) loadTrack(ctxTrackId); }

function ctxEdit() {
  const t = state.tracks.find(t => t.id === ctxTrackId); if (!t) return;
  editingTrackId = t.id; editingTrackNewImg = null;
  document.getElementById('editTrackName').value = t.title;
  document.getElementById('editTrackArtist').value = t.artist || '';
  document.getElementById('editTrackLyrics').value = t.lyrics || '';
  const p = document.getElementById('editTrackImgPreview'), c = trackCover(t);
  p.src = c; p.style.display = c ? 'block' : 'none';
  document.getElementById('editTrackImgPlaceholder').style.display = c ? 'none' : '';
  document.getElementById('editTrackModal').classList.add('open');
}
function handleEditTrackImg(i) {
  if (i.files[0]) {
    editingTrackNewImg = i.files[0];
    const p = document.getElementById('editTrackImgPreview');
    p.src = URL.createObjectURL(editingTrackNewImg); p.style.display = 'block';
    document.getElementById('editTrackImgPlaceholder').style.display = 'none';
  }
}
async function confirmEditTrack() {
  const t = state.tracks.find(t => t.id === editingTrackId); if (!t) return;
  t.title = document.getElementById('editTrackName').value.trim() || t.title;
  t.artist = document.getElementById('editTrackArtist').value.trim();
  t.lyrics = document.getElementById('editTrackLyrics').value.trim();
  if (editingTrackNewImg) { dropUrl('c' + t.id + (t.coverV || '')); t.cover = editingTrackNewImg; t.coverV = Date.now(); }
  await dbPut('tracks', t);
  closeModal('editTrackModal'); updateLyricsDisplay(); renderAll();
}

async function ctxDelete() {
  const t = state.tracks.find(t => t.id === ctxTrackId); if (!t) return;
  if (state.currentTrackId === t.id) { audio.pause(); audio.removeAttribute('src'); state.currentTrackId = null; state.isPlaying = false; updatePlayButton(); }
  await dbDel('tracks', t.id);
  dropUrl('a' + t.id); dropUrl('c' + t.id + (t.coverV || ''));
  state.tracks = state.tracks.filter(x => x.id !== t.id);
  renderAll();
}
</script>
